[project]
name = "molt-analytics"
version = "0.3.0"
description = "Marketplace metrics for Molt"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "requests>=2.32",
    "tabulate>=0.9",
]

[project.scripts]
molt-analytics = "molt_analytics.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/molt_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
